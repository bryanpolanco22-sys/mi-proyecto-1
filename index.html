<!DOCTYPE html>
<html>
<head>
  <title>Carwash Instinto</title>

  <style>
    body {
      margin: 100%;
      font-family: Arial;
      background:BLACK WITH SMALL GOLDEN STARS;
      color: gold;
      text-align: center;
      overflow-x: hidden;
    }

    /* ✨ ESTRELLAS DORADAS */
    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(gold 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.2;
      animation: estrellas 30s linear infinite;
    }

    @keyframes estrellas {
      from { transform: translateY(0); }
      to { transform: translateY(-200px); }
    }

    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      position: relative;
      z-index: 1;
    }

    .glow-text {
      font-size: 35px;
      text-shadow: 0 0 10px gold, 0 0 20px gold;
    }

    .productos, .catalogo {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .card {
      background: #111;
      padding: 15px;
      border-radius: 10px;
      width: 200px;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .neon-btn {
      margin-top: 10px;
      padding: 10px;
      background: linear-gradient(45deg, gold, orange);
      border: none;
      cursor: pointer;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 0 10px gold;
    }

    section {
      margin-top: 60px;
    }
  </style>
</head>

<body>

<header>
  Instinto Luxtic ⌚
</header>

<h2 class="glow-text">Explora nuestros productos</h2>

<!-- 🔝 PRODUCTOS SIN PRECIO -->
<div class="productos">

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Perfumes</h3>
    <button class="neon-btn" onclick="irA('perfumes')">Ver Perfumes</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Relojes</h3>
    <button class="neon-btn" onclick="irA('relojes')">Ver Relojes</button>
  </div>

</div>

<!-- 🧴 SECCIÓN PERFUMES -->
<section id="perfumes">
  <h2 class="glow-text">Perfumes</h2>

  <div class="catalogo">
    <div class="card">
      <img src="https://via.placeholder.com/200">
      <h3>Perfume Premium</h3>
      <p>RD$ 2,500</p>
      <button class="neon-btn" onclick="comprar('Perfume Premium')">Comprar</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/200">
      <h3>Perfume Deluxe</h3>
      <p>RD$ 3,000</p>
      <button class="neon-btn" onclick="comprar('Perfume Deluxe')">Comprar</button>
    </div>
  </div>
</section>

<!-- ⌚ SECCIÓN RELOJES -->
<section id="relojes">
  <h2 class="glow-text">Relojes</h2>

  <div class="catalogo">
    <div class="card">
      <img src="https://via.placeholder.com/200">
      <h3>Reloj Elegante</h3>
      <p>RD$ 3,800</p>
      <button class="neon-btn" onclick="comprar('Reloj Elegante')">Comprar</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/200">
      <h3>Reloj Premium</h3>
      <p>RD$ 4,500</p>
      <button class="neon-btn" onclick="comprar('Reloj Premium')">Comprar</button>
    </div>
  </div>
</section>

<script>
  function comprar(producto) {
    let mensaje = "Hola, quiero comprar " + producto + " de Instinto Luxtic";
    let url = "https://wa.me/18094385474?text=" + encodeURIComponent(mensaje);
    window.open(url, "_blank");
  }

  function irA(seccion) {
    document.getElementById(seccion).scrollIntoView({ behavior: "smooth" });
  }
</script>

</body>
</html>
</body>
</html>
