<!DOCTYPE html>
<html>
<head>
  <title>CARWHAH INSTINTO</title>

  <style>
    body {
      margin: 200;
      font-family: Arial;
      background: BLACK WITH SMALL GOLDEN STARS;
      color: gold;
      text-align: center;
      overflow: hidden;
    }

  
    body::before {
      content: "";
      position: fixed;
      width: 150%;
      height: 150%;
      background-image: radial-gradient(white 2px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.15;
      animation: estrellas 20s linear infinite;
    }

    @keyframes estrellas {
      from { transform: translateY(0); }
      to { transform: translateY(-100px); }
    }

    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      z-index: 1;
      position: relative;
    }

    .glow-text {
      font-size: 40px;
      text-shadow: 
        0 0 10px gold,
        0 0 20px gold,
        0 0 40px orange;
    }

    .productos {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .card {
      background: #111;
      padding: 15px;
      border-radius: 10px;
      width: 200px;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }


    .neon-btn {
      margin-top: 10px;
      padding: 12px;
      background: linear-gradient(45deg, gold, orange);
      border: none;
      cursor: pointer;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 0 10px gold, 0 0 20px orange;
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px gold; }
      to { box-shadow: 0 0 25px gold, 0 0 40px orange; }
    }

    footer {
      margin-top: 20px;
      padding: 15px;
      font-size: 14px;
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>

<header>
  Instinto Luxtic ⌚
</header>

<h1 class="glow-text">Elegancia en cada segundo</h1>

<div class="productos">

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Perfume Premium</h3>
    <p>RD$ 2,500</p>
    <button class="neon-btn" onclick="comprar('Perfume Premium')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Reloj Elegante</h3>
    <p>RD$ 3,800</p>
    <button class="neon-btn" onclick="comprar('Reloj Elegante')">Comprar</button>
  </div>

</div>

<footer>
  © 2026 Instinto Luxtic
</footer>

<script>
  function comprar(producto) {
    let mensaje = "Hola, quiero comprar " + producto + " de Instinto Luxtic";
    let url = "https://wa.me/18094385474?text=" + encodeURIComponent(mensaje);
    window.open(url, "_blank");
  }
</script>

</body>
</html>
